spring.application.name=${SPRING_APPLICATION_NAME}
server.port=${SERVER_PORT}

spring.data.mongodb.uri=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}/${MONGO_DB}?ssl=true&replicaSet=${MONGO_REPLICA_SET}&authSource=${MONGO_AUTH_SOURCE}&retryWrites=true&w=majority
spring.data.mongodb.database=${MONGO_DB}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ========== Logging (Optional) ==========
logging.level.org.springframework=INFO
logging.level.com.smartschool=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.mongodb=INFO

# ========== CORS (Optional if you use CorsConfig.java) ==========
spring.web.cors.allowed-origins=${FRONTEND_URL}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

spring.jackson.time-zone=UTC
spring.mvc.servlet.path=/api

spring.sql.init.mode=never